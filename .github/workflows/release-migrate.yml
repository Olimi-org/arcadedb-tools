name: release-migrate

on:
  push:
    tags:
      - "arcadedb-migrate-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. arcadedb-migrate-v0.2.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-linux-x64:
    name: linux-x64 (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          version: latest
          install: true
          cache: true

      # mise.toml provides protoc + rust, so this is the only toolchain setup.
      - name: Install tools via mise
        run: |
          mise trust
          mise install
          mise exec -- protoc --version
          mise exec -- rustc --version
          mise exec -- cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: migrate-linux-x64

      - name: Build
        run: mise exec -- cargo build --release --locked -p arcadedb-migrate --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          BIN=target/x86_64-unknown-linux-gnu/release/arcadedb-migrate
          "$BIN" --help || true
          mkdir -p dist
          tar -czf "dist/arcadedb-migrate-x86_64-unknown-linux-gnu.tar.gz" \
            -C target/x86_64-unknown-linux-gnu/release arcadedb-migrate
          (cd dist && sha256sum *.tar.gz > SHA256SUMS.txt)
          ls -lh dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
