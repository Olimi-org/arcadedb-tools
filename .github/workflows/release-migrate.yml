name: release-migrate

on:
  push:
    tags:
      - "arcadedb-migrate-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. arcadedb-migrate-v0.2.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      # mise.toml provides protoc + rust, so this is the only toolchain setup.
      - name: Install tools via mise
        run: |
          mise trust
          mise install
          mise exec -- protoc --version
          mise exec -- rustc --version
          mise exec -- cargo --version
          mise exec -- rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: migrate-${{ matrix.target }}

      - name: Build
        run: mise exec -- cargo build --release --locked -p arcadedb-migrate --target ${{ matrix.target }}

      - name: Package
        run: |
          BIN="target/${{ matrix.target }}/release/arcadedb-migrate"
          "$BIN" --help || true
          mkdir -p dist
          tar -czf "dist/arcadedb-migrate-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" arcadedb-migrate
          (cd dist && shasum -a 256 *.tar.gz > "SHA256SUMS-${{ matrix.target }}.txt")
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cp "dist/SHA256SUMS-${{ matrix.target }}.txt" dist/SHA256SUMS.txt
          fi
          ls -lh dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS*.txt
