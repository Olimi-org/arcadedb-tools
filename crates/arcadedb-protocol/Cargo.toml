[package]
name = "arcadedb-protocol"
version = "0.3.0"
description = "A lightweight gRPC client for ArcadeDB: tonic stubs, a typed record-decode path (RecordDecode derive), and a serde_json bridge."
repository = "https://github.com/Olimi-org/arcadedb-tools"
homepage = "https://github.com/Olimi-org/arcadedb-tools"
documentation = "https://docs.rs/arcadedb-protocol"
keywords = ["arcadedb", "grpc", "database", "graph", "vector"]
categories = ["database", "api-bindings"]
license.workspace = true
edition.workspace = true

[features]
default = []
# Exact-decimal support: `rust_decimal::Decimal` ↔ the wire `decimal` kind.
# Values wider than the 96-bit mantissa decode as errors.
decimal = ["dep:rust_decimal"]
# Serde impls for wire-identity types (`Link` ↔ rid string). Off by default.
serde = ["dep:serde"]
# Transient KV cache facade over the Redis plugin (`client.cache()`):
# GET/SET/GETDEL with hex-safe values and a client-enforced TTL envelope.
# Requires serde.
cache = ["dep:serde"]
# Parallel decode/encode of large batches via rayon. Small batches stay
# sequential.
rayon = ["dep:rayon"]

[dependencies]
rust_decimal = { version = "1", optional = true, default-features = false }
rayon = { version = "1", optional = true }
thiserror = "2"
serde = { version = "1", optional = true, features = ["derive"] }
arcadedb-record-macros = { path = "../arcadedb-record-macros", version = "0.1.0" }
# chrono is used by the decode bridge to render protobuf Timestamp → RFC3339.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
http = "1"
prost = "0.14"
prost-types = "0.14"
# tonic-prost is required at runtime: tonic-prost-build generates client stubs
# that reference `tonic_prost::ProstCodec` for the streaming RPC codecs.
tonic-prost = "0.14"
serde_json = "1"
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }
tokio-stream = { version = "0.1", default-features = false }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
criterion = "0.8"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "decode_strats"
harness = false

[[bench]]
name = "par_rows"
harness = false
required-features = ["rayon"]
